name: Update contribution calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_contributions.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVG
        env:
          GITHUB_USERNAME: emma-dasilva-dev
        run: python scripts/generate_contributions.py
      - name: Commit updated calendar
        run: |
          if [ -n "$(git status --porcelain -- assets/contributions.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/contributions.svg
            git commit -m "chore: refresh contribution calendar"
            git push
          fi
